# Тесты всех инструментов devkit на каждый push: локально они гоняются
# руками, и без CI зелёность держалась только на дисциплине.
name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Перечень го-модулей раннер находит сам, по факту go.mod под tools/
      # (parallel.go_tools): хранёный список руками уже расходился с деревом
      # и молчал об этом, пока cmdout и secretctl не выпали из CI незамеченно
      # (находка DK-508). Сквозной прогон дашборда идёт тем же шагом
      # (smoke_test.go): чужие программы он изображает своими фикстурами,
      # живого tmux и taskctl ему не нужно.
      - name: тесты го-модулей tools
        run: python3 tools/devkitctl/parallel.py --only-go
      - name: тесты хуков
        run: python3 -m unittest discover -p '*_test.py'
        working-directory: hooks
      - name: тесты devkitctl
        run: python3 -m unittest discover -p '*_test.py'
        working-directory: tools/devkitctl
      - name: тесты скиллов
        run: python3 kit/skills/check-skills.py
      - name: юниты самопроверки скиллов
        run: python3 -m unittest discover -p '*_test.py'
        working-directory: kit/skills
      - name: тесты оболочки цели
        run: python3 -m unittest discover -p '*_test.py'
        working-directory: kit/skills/goal-loop
      - name: тесты корпуса прозы
        run: python3 -m unittest discover -p '*_test.py'
        working-directory: kit/skills/prose
      - name: запрещённые символы по всем файлам
        run: git ls-files -z | xargs -0 python3 hooks/check-symbols.py
      - name: бит исполнения test.sh по всему репозиторию
        run: python3 hooks/check-exec-bit.py
      # Раскладка гоняется своим флагом, а не полным доктором: тот смотрит на
      # ~/.claude, собранные бинари, tmux и снимок квоты, и на машине сборщика
      # нашёл бы десяток находок про ненастроенное окружение.
      - name: раскладка репозитория
        run: python3 tools/devkitctl/devkitctl.py doctor --layout
