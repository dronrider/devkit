# Ось скиллов: инструмент объявляет скиллы сессии сам, глубина правил у него
# ядро (docs/lld/DK-100-context-tree.md, раздел «Харнесы без скиллов»).
[detect]

[rules]
mode = "import"
file = "SOMETOOL.md"
import_line = "@{path}"

[delegate]
mode = "none"

[hooks]

[quota]

[skills]
dir = "~/.sometool/skills"
format = "sometool"
discovery = "auto"
