# Профиль Claude Code: чем инструмент располагает и как devkit им пользуется.
# Формат это подмножество TOML из docs/lld/DK-033-universal-kit.md, читают его
# agentctl (Go) и devkitctl (Python), каждый своим парсером.

[detect]
env = "CLAUDECODE"
value = "1"
bin = "claude"

[rules]
mode = "import"
file = "CLAUDE.md"
import_line = "@{path}"
global_file = "~/.claude/CLAUDE.md"

[delegate]
# Внутри своей сессии субагент рождается спавном, это и значит native. Наружу
# тот же клиент выходит командой, и уехавшая сюда ступень поднимается ею: режим
# называет спавн, а не достижимость. Каталог конфигурации у команды домашний,
# поэтому пар окружения ей не нужно, а имя сессии подпроцессу даёт run, по нему
# он кладёт ход работы боковым журналом в разговор, раздавший задачу.
mode = "native"
command = ["claude", "-p", "{prompt}", "--model", "{model}", "--effort", "{effort}", "--session-id", "{session}"]
agents_dir = "~/.claude/agents"
agents_format = "claude-code"
map_mini = "haiku"
map_base = "sonnet"
map_pro = "opus"
map_max = "fable"

[hooks]
protocol = "claude-code"
config = "~/.claude/settings.json"
events = ["write", "session-start", "notify", "subagent-done", "turn-done", "turn-failed", "prompt-submit", "tool-done"]
memory_index = "/memory/MEMORY.md"

[skills]
dir = "~/.claude/skills"
format = "claude-code"
discovery = "auto"

[quota]
snap = "usage-pane"
# week_opus известен, но ни один ярус из него не тратит: панель показывала его
# до 2.1.220, и снимок со старого клиента должен читаться, а не отбрасываться.
# Добавочный бакет сегодняшней панели зовётся week_fable, его читает псевдоним.
buckets = ["week_all", "week_max", "week_opus"]
required = "week_all"
spend_mini = ["week_all"]
spend_base = ["week_all"]
# pro жжёт week_max наравне с max: замер DK-089 показал, что opus расходует
# добавочный бакет, и прежде корректор поднимал его по запасу, которого нет.
spend_pro = ["week_all", "week_max"]
spend_max = ["week_all", "week_max"]
