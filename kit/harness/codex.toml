# Профиль Codex: клиент OpenAI, читающий AGENTS.md в корне проекта. Импорты
# вида @{path} он не разворачивает, поэтому правила доезжают только вклейкой в
# сам AGENTS.md (mode = "embed"), а тонкого файла у харнеса нет вовсе. Формат
# профиля это подмножество TOML из docs/lld/DK-033-universal-kit.md, читают его
# agentctl (Go) и devkitctl (Python), каждый своим парсером.

# Детект по CODEX_THREAD_ID: её ставит сам Codex живой сессии, и переменная
# непуста ровно пока сессия идёт. CODEX_HOME не годится: она задаёт каталог
# настроек и сессию не называет, а в сессии, поднятой вне Codex, отсутствует.
[detect]
env = "CODEX_THREAD_ID"
bin = "codex"

[rules]
mode = "embed"

[delegate]
# Спавна субагента снаружи у клиента нет, уехавшая ступень поднимается
# командой. Флаги сверены по codex exec --help 0.163.0: промпт идёт
# позиционным аргументом, модель своим флагом, усилие ключом конфига
# model_reasoning_effort (уровни low, medium, high, xhigh клиента покрывают
# четыре уровня маппинга devkit). Песочница workspace-write, рабочая политика
# самого клиента; обходов одобрений в команде нет сознательно. Имени сессии
# codex exec не принимает, поэтому {session} в команде нет, и run честно
# говорит, что ход работы делегата в ленте раздавшего разговора не покажется.
mode = "cli"
command = ["codex", "exec", "--sandbox", "workspace-write", "--model", "{model}", "-c", "model_reasoning_effort=\"{effort}\"", "{prompt}"]
# Маппинг-предложение: одну модель на все ярусы даёт каталог установленного
# клиента (gpt-6.1-sol, это же имя показывает его живая сессия). Различаются
# ярусы усилием, его в команду подставляет {effort}. Имена из каталога, но не
# проверенные живым делегированием, профиль не называет.
map_mini = "gpt-6.1-sol"
map_base = "gpt-6.1-sol"
map_pro = "gpt-6.1-sol"
map_max = "gpt-6.1-sol"

[hooks]

[quota]

# Скиллы клиент подхватывает сам из пользовательского каталога навыков
# контракта Codex, скан там автоматический, и указатель им не нужен.
# Формат скиллов тот же, что у Claude Code: каталог с SKILL.md и frontmatter
# name и description, поэтому раскладка devkit едет без адаптера.
# Ограничение оси правил: глобальной точки у embed-харнеса нет, она работает
# импортами, которые Codex не разворачивает. В подключённом проекте Codex
# получает вклейку в AGENTS.md, на глубине core она несёт ядро доски.
[skills]
dir = "~/.agents/skills"
format = "claude-code"
discovery = "auto"
