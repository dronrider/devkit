# Профиль второй подписки: тот же клиент Claude Code, поднятый на другом
# каталоге конфигурации, откуда он берёт свой endpoint и токен. Близнец
# claude-code.toml, у которого машинные пути считаются от {home}, а не прибиты к
# ~/.claude: вторая подписка это не другой инструмент, а вторая раскладка того
# же. Каталог лежит в машинном слое (~/.devkit/harness.local, ключ home секции
# [glm-code]), в коммитируемом файле ему места нет.
# Разбор в docs/lld/DK-090-heterogeneous-ladder.md, раздел «Профиль второй
# подписки».

# Детекта нет сознательно: изнутри сессии вторая подписка от первой переменными
# неотличима (тот же CLAUDECODE=1), и объявленный детект дал бы неоднозначное
# совпадение сразу у двух харнесов. Активным этот становится только явным
# именем, а его ставит run подпроцессу либо запускатор окну редактора.
[detect]

[rules]
mode = "import"
file = "CLAUDE.md"
import_line = "@{path}"
global_file = "{home}/CLAUDE.md"

[delegate]
# Спавна субагента снаружи у клиента нет, поэтому уехавшая ступень поднимается
# командой. Шаблон проверен живьём на подписке: промпт идёт позиционным
# аргументом, effort у клиента свой флаг с теми же четырьмя уровнями, что у
# маппинга devkit. Права неинтерактивной сессии во флаги не выносятся, их
# раскладывает devkitctl doctor в settings.json каталога (tools/devkitctl/perms.py).
# Имя сессии подпроцессу даёт run: по нему он находит транскрипт делегата под
# {home} и кладёт его боковым журналом в разговор, раздавший работу, иначе ход
# работы второй подписки не виден нигде (DK-581).
mode = "cli"
command = ["claude", "-p", "{prompt}", "--model", "{model}", "--effort", "{effort}", "--session-id", "{session}"]
agents_dir = "{home}/agents"
agents_format = "claude-code"
# Подписка отдаёт две модели, дешёвую и сильную, поэтому верхние три яруса
# сложены повторением: имена проверены живым прогоном, а не взяты из головы.
# glm-5.2 машинный слой z.ai молча перенаправляет на glm-5.3, поэтому зовётся
# сразу сегодняшняя модель.
map_mini = "glm-4.7"
map_base = "glm-5.3"
map_pro = "glm-5.3"
map_max = "glm-5.3"

[hooks]
protocol = "claude-code"
config = "{home}/settings.json"
events = ["write", "session-start", "notify", "subagent-done", "turn-done", "turn-failed", "prompt-submit", "tool-done"]
memory_index = "/memory/MEMORY.md"

[skills]
dir = "{home}/skills"
format = "claude-code"
discovery = "auto"

# Остаток снимает kit/harness/snap/glm-code.sh: эндпоинт мониторинга подписки
# отвечает тем же токеном, которым работает клиент, и отдаёт оба окна сразу.
# Окна два, пятичасовое и недельное, и тратит из обоих каждый ярус: разница
# между ярусами только в цене кредита, а не в том, какое окно они жгут.
# Обязателен недельный: он единственный, что до сброса сам не восстановится.
[quota]
snap = "script"
script = "snap/glm-code.sh"
buckets = ["window5h_all", "week_all"]
required = "week_all"
spend_mini = ["window5h_all", "week_all"]
spend_base = ["window5h_all", "week_all"]
spend_pro = ["window5h_all", "week_all"]
spend_max = ["window5h_all", "week_all"]
