# Профиль четвёртой подписки. Тот же клиент Claude Code на собственном каталоге
# конфигурации, близнец routerai.toml. Служба это платформа Xiaomi MiMo, клиент
# работает с ней через Anthropic-совместимый /v1/messages. Остаток пакета
# кредитов снимается из кабинета платформы, съёмщик в kit/harness/snap/mimo.sh.
# Каталог лежит в машинном слое (~/.devkit/harness.local, ключ home секции
# [mimo]), в коммитируемом файле ему места нет.
# Разбор в docs/lld/DK-090-heterogeneous-ladder.md.

# Детекта нет сознательно. Изнутри сессии по переменным подписка неотличима
# от первой (тот же CLAUDECODE=1). Объявленный детект дал бы неоднозначное
# совпадение сразу у нескольких харнесов. Активным этот становится только
# явным именем, а его ставит run подпроцессу либо exec голове задачи.
[detect]

[rules]
mode = "import"
file = "CLAUDE.md"
import_line = "@{path}"
global_file = "{home}/CLAUDE.md"

[delegate]
# Спавна субагента снаружи у клиента нет. Уехавшая ступень поднимается
# командой. Шаблон тот же, что у routerai.toml. Промпт идёт позиционным
# аргументом, effort у клиента свой флаг с теми же четырьмя уровнями, что у
# маппинга devkit. Имя сессии подпроцессу даёт run. По нему он находит
# транскрипт делегата под {home} и пишет его боковым журналом в разговор,
# раздавший работу (DK-581).
mode = "cli"
command = ["claude", "-p", "{prompt}", "--model", "{model}", "--effort", "{effort}", "--session-id", "{session}"]
agents_dir = "{home}/agents"
agents_format = "claude-code"
# План отдаёт две текстовые модели серии V2.6: flash и pro. Каталожные
# mimo-v2.6-pro[1m] и mimo-v2.6-pro-ultraspeed плану недоступны, и верхние
# ярусы стоят на pro.
# Алиасы первой лестницы, которыми клиент принимает параметр model у субагента,
# сворачиваются на эти же модели подстановками в env каталога подписки
# (ANTHROPIC_DEFAULT_<АЛИАС>_MODEL); их раскладывает и сверяет доктор, разбор
# в docs/lld/DK-090-heterogeneous-ladder.md, «Дорога модели из вердикта до
# клиента» (DK-751).
map_mini = "mimo-v2.6-flash"
map_base = "mimo-v2.6-flash"
map_pro = "mimo-v2.6-pro"
map_max = "mimo-v2.6-pro"

[hooks]
protocol = "claude-code"
config = "{home}/settings.json"
events = ["write", "session-start", "notify", "subagent-done", "turn-done", "turn-failed", "prompt-submit", "tool-done"]
memory_index = "/memory/MEMORY.md"

[skills]
dir = "{home}/skills"
format = "claude-code"
discovery = "auto"

# Голова задачи (DK-931), ключи те же, что у routerai.toml. Клиент идёт
# через agentctl exec. Пары окружения подписки задаёт он. bin определяет сам
# клиент, его подъём и ищет в PATH.
[head]
client = ["agentctl", "exec", "--harness", "mimo", "--", "claude", "--permission-mode", "auto"]
bin = "claude"
model = ["--model", "{model}"]
session = ["--session-id", "{session}"]
name = ["--name", "{name}"]
resume = ["agentctl", "exec", "--harness", "mimo", "--", "claude", "--resume", "{session}"]
turn_end = "turn-mark"
wait_cap = "2h"

# Остаток снимает сменный съёмщик snap/mimo.sh. Эндпоинт использования
# находится в кабинете платформы и открывается куками сессии учётной записи,
# а не ключом модели. Куки съёмщик берёт из хранилища секретов под собственным
# именем mimo-cabinet-cookie (ключ модели остаётся под mimo-token), адрес
# кабинета из машинного конфига квоты. Ни то, ни другое в коммитируемые тексты
# не едет. Сессия обновляется самоходом. Началом продления служит сам эндпоинт
# использования. Его 401-ответ несёт loginUrl с подписью платформы. Цепочка
# по этому адресу с пасспортными куками из секрета mimo-passport-cookie
# переиздаёт serviceToken. Свежая кука кабинета пишется обратно командой
# secretctl set. Пасспортный секрет остаётся исходным, переизданный по дороге
# состав обратно не записывается. В запасе для входа лежат адрес аккаунта в
# том же конфиге под ключом mimo-passport и секреты mimo-cabinet-account и
# mimo-cabinet-password. Когда сессия обновлялась в последний раз, это
# записано в файле <харнес>.renew.local в каталоге квоты. Плановое продление
# идёт раз в двенадцать часов и не чаще попытки в час.
# Месячный бакет даёт корректору грубый процент, точные числа кредитов едут
# строками «N кред» и разбираются по значению, как рублёвые у routerai.
[quota]
snap = "script"
script = "snap/mimo.sh"
buckets = ["month_plan"]
required = "month_plan"
spend_mini = ["month_plan"]
spend_base = ["month_plan"]
spend_pro = ["month_plan"]
spend_max = ["month_plan"]
