# Профиль подписки OpenCode Go: тот же клиент Claude Code на собственном
# каталоге конфигурации, близнец glm-code.toml и routerai.toml. Служба это
# inference OpenCode Go, клиент говорит с ней Anthropic-совместимым API по
# адресу https://opencode.ai/inference/go/anthropic из официальной документации
# OpenCode. Адрес и ключ лежат в машинном слое, в settings.json каталога
# подписки, в коммитируемый файл им места нет. Сам каталог объявлен ключом home
# секции [opencode-go] файла ~/.devkit/harness.local.

# Детекта нет сознательно: изнутри сессии подписка от первой переменными
# неотличима (тот же CLAUDECODE=1), и объявленный детект дал бы неоднозначное
# совпадение сразу у нескольких харнесов. Активным этот становится только явным
# именем, а его ставит run подпроцессу либо exec голове задачи.
[detect]

[rules]
mode = "import"
file = "CLAUDE.md"
import_line = "@{path}"
global_file = "{home}/CLAUDE.md"

[delegate]
# Спавна субагента снаружи у клиента нет, поэтому уехавшая ступень поднимается
# командой. Шаблон тот же, что у glm-code.toml: промпт идёт позиционным
# аргументом, effort у клиента свой флаг. Семья DeepSeek даёт три ступени low,
# high, max на всех моделях, включая flash (DK-1570, макет шкалы v4). Имя
# сессии подпроцессу даёт run: по нему он находит транскрипт делегата под {home}
# и кладёт его боковым журналом в разговор, раздавший работу (DK-581).
mode = "cli"
command = ["claude", "-p", "{prompt}", "--model", "{model}", "--effort", "{effort}", "--session-id", "{session}"]
agents_dir = "{home}/agents"
agents_format = "claude-code"
effort_mini = ["low", "high", "max"]
effort_base = ["low", "high", "max"]
effort_pro = ["low", "high", "max"]
effort_max = ["low", "high", "max"]
# Подписка отдаёт две модели deepseek: лёгкую flash и тяжёлую pro, нижние ярусы
# идут flash, верхние pro. Имена из каталога подписки, живой прогон на машине
# делает машинный слой. Алиасы первой лестницы, которыми клиент принимает
# параметр model у субагента, сворачиваются на эти же модели подстановками в
# env каталога подписки (ANTHROPIC_DEFAULT_<АЛИАС>_MODEL); их раскладывает и
# сверяет доктор, разбор в docs/lld/DK-090-heterogeneous-ladder.md, «Дорога
# модели из вердикта до клиента» (DK-751).
map_mini = "deepseek-v4.1-flash"
map_base = "deepseek-v4.1-flash"
map_pro = "deepseek-v4-pro"
map_max = "deepseek-v4-pro"

[hooks]
protocol = "claude-code"
config = "{home}/settings.json"
events = ["write", "session-start", "notify", "subagent-done", "turn-done", "turn-failed", "prompt-submit", "tool-done"]
memory_index = "/memory/MEMORY.md"

[skills]
dir = "{home}/skills"
format = "claude-code"
discovery = "auto"

# Голова задачи (DK-931), ключи те же, что у glm-code.toml. Клиент идёт
# через agentctl exec: пары окружения подписки кладёт он, как и при подъёме
# окна с экраном задач. bin называет сам клиент, его подъём и ищет в PATH.
[head]
client = ["agentctl", "exec", "--harness", "opencode-go", "--", "claude", "--permission-mode", "auto"]
bin = "claude"
model = ["--model", "{model}"]
session = ["--session-id", "{session}"]
name = ["--name", "{name}"]
resume = ["agentctl", "exec", "--harness", "opencode-go", "--", "claude", "--resume", "{session}", "--model", "{model}"]
turn_end = "turn-mark"
wait_cap = "2h"

# Съёмщика остатка профиль не объявляет: публичного эндпоинта мониторинга за
# подпиской не найдено, и выдуманный скрипт обещал бы снимок, которого нечем
# снимать. Секция пуста, корректор для подписки выключен, чужие квоты на неё
# не меряются. Появится у подписки счётчик остатка, съёмщик заведётся своей
# задачей.
[quota]
