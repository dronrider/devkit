# Профиль из более свежего devkit: незнакомый ключ, незнакомая секция и
# незнакомое событие переживаются предупреждением, а не отказом.
tool = "sometool"

[detect]
env = "SOMETOOL"
bin = "sometool"
container = "docker"

[rules]
mode = "embed"

[delegate]
mode = "none"

[hooks]
protocol = "sometool"
events = ["write", "telepathy"]

[quota]

[telemetry]
endpoint = "https://example.invalid"
