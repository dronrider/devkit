# Пороги сторожа плана hooks/plan-watch.py. Формат тот же, что у профилей
# харнеса: подмножество TOML из docs/lld/DK-033-universal-kit.md.
#
# Откуда числа: находка DK-609, где в кольце диспетчерской сессии висели два
# шага многочасовой давности. Пороги стоят выше обычного шага работы и ниже
# того возраста, на котором план врёт уже заметно. Своих чисел код не держит,
# перекалибровка это правка этого файла, а не правка хука.

[plan]
# Идущий пункт старше стольких часов при нестоящем плане. Этап задачи доски
# редко идёт дольше часа, а три часа это уже заход, в котором работа сменилась
# и пункт остался от прежней.
step_hours = 3
# Сколько ходов сессия работает поверх плана, закрытого целиком. Ход, которым
# закрывается последний пункт, сторожа не будит: сессия на нём как раз
# доработала. Два хода поверх закрытого плана значат, что работа пошла дальше,
# а плана у неё нет.
done_turns = 2
# Сколько ходов подряд план стоит без правки при незакрытых пунктах. Десять
# ходов это заход, где сессия успела сменить занятие, не отметив этого ни
# шагом, ни закрытием.
still_turns = 10
