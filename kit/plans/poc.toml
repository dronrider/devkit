# Шаблон плана режима POC (LLD DK-459, решение 3; LLD DK-972, решение 12).
#
# Режим берут, когда неизвестен сам результат, и проверяют его показом
# пользователю. До показа едет только доставка, а тесты, ревью, вычитка, стенд
# и обкатка отложены и сняты записями dropped с причиной. Утверждённый POC
# сливается как есть, доводка режется отдельными строками по диффу.
name = "poc"
title = "Режим POC: доставка до пользователя, показ и слияние как есть"
dropped = ["tests: результат неизвестен, тесты пишутся на доводке после показа", "proofread: долгоживущего текста у пробы нет", "stand: скиллы и страницы-контракты проба не трогает", "rehearsal: обкатывать нечего, сценарий проверки это сам показ", "review: ревью едет доводкой, отрезанной по диффу утверждённой пробы"]

[plan]
title = "план работ"
skill = "work-plan"
by = "сам"
trace = "слово"

[start]
title = "взятие в работу"
skill = "board-task"
by = "сам"
trace = "слово"

[work]
title = "разработка"
skill = "poc"
by = "сам"
trace = "stage:разработка"
slot = true

[show]
title = "показ"
skill = "poc"
by = "человек"
trace = "слово"

[ship]
title = "слияние"
skill = "board-ship"
by = "сам"
trace = "merged"
gate = ["check"]

[verify]
title = "проверка"
skill = "board-task"
by = "субагент"
agent = "exec-*"
trace = "verify"
gate = ["close"]
