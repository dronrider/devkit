# Пороги сторожа прозы hooks/check-prose.py. Формат тот же, что у профилей
# харнеса: подмножество TOML из docs/lld/DK-033-universal-kit.md.
#
# Откуда числа: замер 38,5 тыс. слов агентской прозы против человеческого
# корпуса, таблица в docs/tasks/DK-446.md, раздел «Что показал замер». Порог
# предупреждения стоит выше человеческой колонки и ниже агентской, порог
# блокировки на уровне агентской, предупреждение означает «текст поехал»,
# а блокировка ловит чистый шаблон. Расстояние от человеческой колонки до
# агентской предупреждение проходит на четверть, этот шаг взят из первой
# раскладки порогов (DK-533). Пороги целые, дробного шага этим частотам не
# нужно.

[prose]
# warn: находки только подсказкой, ход остаётся удачным.
# block: превышение блокирующего порога отбивает запись, и агент переписывает.
mode = "warn"
# Меньше этого куска частоты скачут от одного предложения, и мерить их нечего.
min_words = 120
suffixes = [".md"]

# Порог предупреждения: текст ушёл от человеческой колонки замера. Проверен
# репликами пользователя из корпуса эталонов (kit/skills/prose/corpus,
# фрагменты с источником «журнал сессии»), на них ни одна метрика порога не
# переходит. Первый коммит RULES.md опорой больше не служит, приёмка DK-522
# отбраковала его как текст, писанный вместе с моделью.
[warn]
sentence_len = 19
long_sentences = 20
argued = 29
colon_mid = 11
but_not_tail = 2
aphorism = 2

# Порог блокировки: текст встал на агентскую колонку замера.
[block]
sentence_len = 23
long_sentences = 30
argued = 48
colon_mid = 19
but_not_tail = 5
aphorism = 6

# Сторож калек hooks/check-calque.py. Признака по форме у него нет: латиница
# через дефис с кириллицей даёт по .md репозитория 2250 совпадений вроде
# «tmux-сессия» и «git-хуки», и калек среди них нет. Границу держит список
# слов ниже, а исключения лежат в словаре проекта
# (kit/skills/proofread/dictionary.md).
[calque]
# warn: находки подсказкой, ход остаётся удачным. block: запись отбивается.
mode = "warn"
suffixes = [".md"]

# Статья списка: написания одного слова через запятую, замена после «->».
# Написания несут латиницу, транслит и составное через дефис; звёздочка на
# конце это любое окончание. Слова собраны разбором DK-1022: они пришли из
# README и сообщений утилит в черновики и в задачи.
[calque-words]
region = "тестов* регион*, test region -> тестовая часть файла"
splice = "сплайс*, splice -> склейка"
production = "продакшн*, продакшен*, production -> боевой контур"
inline = "инлайн*, inline -> тест в одном файле с правкой, скрипт в самой странице"
industrial = "производствен* -> боевой"

# Сторож выборки hooks/check-prose-sample.py и отметка hooks/prose-mark.py
# (DK-1024). Пути ниже разложены по жанру prose.py sample (kit/skills/prose,
# раздел «Кто зовёт»): жанр без секции хук не разбирает, список жанров
# фиксирован кодом хука, здесь лежат только пути и режим.
[sample]
# warn: подсказка добавкой к ходу, запись проходит. block: запись отбивается,
# и агент берёт выборку раньше следующей попытки. Стенд DK-1022 показал 0 из
# 19 вызовов у haiku на одной фразе правила в контексте, подсказка после
# записи это та же фраза, и умолчание жёстче, чем у [prose] выше.
mode = "block"
# Машинные файлы под тем же суффиксом .md, что и жанр «readme»: доску пишет
# taskctl, а не агент, а карта проекта генерируется devkitctl map. Хук их не
# трогает не потому, что их не видит (Write мимо агента хук вовсе не
# получает), а на случай прямой правки через Edit.
exclude = ["docs/TASKS.md", "docs/TASKS-archive.md", "docs/map.md"]

[sample-task]
paths = ["docs/tasks/*.md"]

[sample-lld]
paths = ["docs/lld/*.md"]

[sample-readme]
paths = ["README.md", "docs/*.md"]

[sample-skill]
paths = ["kit/skills/*/SKILL.md"]
