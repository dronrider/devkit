# Пороги сторожа прозы hooks/check-prose.py. Формат тот же, что у профилей
# харнеса: подмножество TOML из docs/lld/DK-033-universal-kit.md.
#
# Откуда числа: замер 38,5 тыс. слов агентской прозы против человеческого
# корпуса, таблица в docs/tasks/DK-446.md, раздел «Что показал замер». Порог
# предупреждения стоит выше человеческой колонки и ниже агентской, порог
# блокировки на уровне агентской, предупреждение означает «текст поехал»,
# а блокировка ловит чистый шаблон. Расстояние от человеческой колонки до
# агентской предупреждение проходит на четверть, этот шаг взят из первой
# раскладки порогов (DK-533). Пороги целые, дробного шага этим частотам не
# нужно.

[prose]
# warn: находки только подсказкой, ход остаётся удачным.
# block: превышение блокирующего порога отбивает запись, и агент переписывает.
mode = "warn"
# Меньше этого куска частоты скачут от одного предложения, и мерить их нечего.
min_words = 120
suffixes = [".md"]

# Порог предупреждения: текст ушёл от человеческой колонки замера. Проверен
# репликами пользователя из корпуса эталонов (kit/skills/prose/corpus,
# фрагменты с источником «журнал сессии»), на них ни одна метрика порога не
# переходит. Первый коммит RULES.md опорой больше не служит, приёмка DK-522
# отбраковала его как текст, писанный вместе с моделью.
[warn]
sentence_len = 19
long_sentences = 20
argued = 29
colon_mid = 11
but_not_tail = 2
aphorism = 2

# Порог блокировки: текст встал на агентскую колонку замера.
[block]
sentence_len = 23
long_sentences = 30
argued = 48
colon_mid = 19
but_not_tail = 5
aphorism = 6
