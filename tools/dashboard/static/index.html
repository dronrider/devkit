<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд devkit</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="screen" id="screen">
  <aside class="side">
    <div class="brand">
      <span class="logo" id="logo-side" title="На главную">dk</span>
      <div>
        <h1>Дашборд devkit</h1>
        <p id="brand-note"></p>
      </div>
      <button class="sfold" id="side-fold" aria-label="Свернуть колонку меню" title="Свернуть колонку меню: место достанется доске" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 7.5L10 12l4.5 4.5"></path><path d="M18 5.5v13"></path></svg></button>
    </div>
    <div class="sgroup">Проекты</div>
    <nav id="projects"></nav>
    <div class="sgroup">Разделы</div>
    <div class="sitem" id="nav-home">Главная</div>
    <div class="sitem" id="nav-board">Доска</div>
    <div class="sitem" id="nav-lld">LLD</div>
    <div class="squota" id="quota"></div>
    <div class="sfoot"><button id="logout" class="btn">Выйти</button></div>
  </aside>
  <main class="bmain">
    <div class="bhead">
      <!-- разворот свёрнутой колонки: кнопка встаёт туда, где был её верхний
           уголок, и возвращает колонку тем же движением, каким её убрали -->
      <button class="sfold sfold-back" id="side-show" aria-label="Развернуть колонку меню" title="Развернуть колонку меню" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.5L14 12l-4.5 4.5"></path><path d="M6 5.5v13"></path></svg></button>
      <span class="logo logo-top" id="logo-top" title="На главную">dk</span>
      <h2 id="pname"></h2>
      <span id="hlegend"></span>
      <span class="hsp"></span>
      <div class="hfind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><input id="hq" type="text" autocomplete="off" placeholder="Поиск задач" aria-label="Поиск по доске, черновикам и архиву"><button class="fclear" id="hq-clear" aria-label="Сбросить поиск" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8"></path><path d="M12 4l-8 8"></path></svg></button></div>
      <button class="bell" id="make-btn" aria-label="Новая задача" title="Новая задача"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5.5v13"></path><path d="M5.5 12h13"></path></svg></button>
      <button class="bell hfbtn" id="find-btn" aria-label="Поиск задач" title="Поиск задач"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></button>
      <button class="bell" id="chats" aria-label="Чаты" title="Чаты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5h15v10h-9l-4 3.5v-3.5h-2Z"></path><path d="M8 9.5h8"></path><path d="M8 12.5h5"></path></svg></button>
      <!-- полка ждущих (DK-696): кто ждёт ответа прямо сейчас, всеми досками
           сразу; стоит рядом с лентой, потому что лента говорит, что случилось,
           а полка кому отвечать -->
      <button class="bell" id="waits" aria-label="Никто не ждёт ответа" title="Никто не ждёт ответа"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5.2l3.2 1.9"></path></svg><i id="waits-n" class="wnum" hidden></i></button>
      <button class="bell" id="bell" aria-label="Лента уведомлений" title="Лента уведомлений"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.6c0-3.3-2.7-6-6-6s-6 2.7-6 6c0 4.1-1.1 5.8-1.9 6.7-.4.4-.1 1.1.5 1.1h14.8c.6 0 .9-.7.5-1.1-.8-.9-1.9-2.6-1.9-6.7Z"></path><path d="M10 19.2c.4.8 1.1 1.3 2 1.3s1.6-.5 2-1.3"></path></svg><i id="bell-dot" class="bdot" hidden></i></button>
      <select class="pselect" id="pselect" aria-label="Проект"></select>
    </div>
    <div class="groups" id="groups"></div>
  </main>
  <!-- панель разговора (LLD DK-430, решение 5): узел стоит в разметке всегда, а
       показан бывает по хвосту адреса; на широком экране она сжимает доску
       рядом, ниже 1100 точек ложится поверх неё, на узком занимает его целиком -->
  <aside class="cpanel" id="cpanel" hidden aria-label="Чат с агентом">
    <i class="cgrab" id="cgrab" role="separator" aria-orientation="vertical" aria-label="Ширина панели чата"></i>
    <!-- список разговоров слева от ленты (DK-436): у задачи её собственные, у
         общего чата доски разговоры проекта без задачи; на узком экране он
         ложится полосой над лентой -->
    <div class="clist" id="clist" aria-label="Чаты"></div>
    <div class="cpin" id="cpin"></div>
  </aside>
  <!-- возврат в разговор (телефон): панель отдала экран переходу по ссылке из
       ленты, а сам разговор остался в памяти -->
  <div class="cback" id="cback" hidden></div>
  <nav class="ptabs">
    <div class="ptab" id="tab-home"><s></s>Главная</div>
    <div class="ptab" id="tab-board"><s></s>Доска</div>
  </nav>
  <div class="flashes" id="flashes"></div>
</div>
<!-- значки экранов лежат разметкой, а js их только копирует: рисовать фигуры
     рамками в стилях выходило обрубками, а внешних картинок у статики нет -->
<template id="icons">
  <svg data-ico="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg>
  <svg data-ico="i-wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5v5l3 1.8"></path></svg>
  <svg data-ico="i-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"></path></svg>
  <svg data-ico="i-rank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19v-5"></path><path d="M12 19V8"></path><path d="M19 19V4"></path></svg>
  <svg data-ico="i-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-8.5"></path></svg>
  <svg data-ico="i-other" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle></svg>
  <svg data-ico="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6.5l9 5.5-9 5.5Z"></path></svg>
  <svg data-ico="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5c0 3.6-3.6 6.5-8 6.5-.9 0-1.8-.1-2.6-.4L5 20.5l1.2-3.2C4.8 16.1 4 14.4 4 12.5 4 8.9 7.6 6 12 6s8 2.9 8 6.5Z"></path></svg>
  <svg data-ico="i-find" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
  <svg data-ico="i-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"></path></svg>
  <svg data-ico="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"></path><path d="M7 12h10"></path><path d="M10 17.5h4"></path></svg>
  <svg data-ico="i-dots" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
  <svg data-ico="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 6v12"></path><path d="M6 12h12"></path></svg>
  <svg data-ico="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16Z"></path><path d="M14.5 5.5l3 3"></path></svg>
  <svg data-ico="i-wide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H5v4"></path><path d="M15 19h4v-4"></path><path d="M5 5l6 6"></path><path d="M19 19l-6-6"></path></svg>
  <svg data-ico="i-narrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h4V5"></path><path d="M19 15h-4v4"></path><path d="M9 9L4 4"></path><path d="M15 15l5 5"></path></svg>
  <svg data-ico="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 5.5H6A1.5 1.5 0 0 0 4.5 7v9"></path></svg>
  <svg data-ico="i-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"></path><path d="M13 7l5 5-5 5"></path></svg>
  <svg data-ico="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H6"></path><path d="M11 7l-5 5 5 5"></path></svg>
  <svg data-ico="i-fold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"></path></svg>
  <svg data-ico="i-unfold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14l5-5 5 5"></path></svg>
  <svg data-ico="i-read" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5S9.5 4.5 4 5v13c5.5-.5 8 1.5 8 1.5s2.5-2 8-1.5V5c-5.5-.5-8 1.5-8 1.5Z"></path><path d="M12 6.5v13"></path></svg>
  <svg data-ico="i-play-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5l8 5.5-8 5.5Z"></path></svg>
  <svg data-ico="i-pick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg>
  <svg data-ico="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="4" rx="1"></rect><path d="M5.5 9v9.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9"></path><path d="M10 13h4"></path></svg>
  <svg data-ico="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8.5l-6.5 6.5a2.5 2.5 0 0 0 3.5 3.5l7-7a4.5 4.5 0 0 0-6.4-6.4l-7 7a6.5 6.5 0 0 0 9.2 9.2l4.2-4.2"></path></svg>
  <svg data-ico="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10"></path><path d="M17 7l-10 10"></path></svg>
</template>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
