<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд devkit</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="screen">
  <aside class="side">
    <div class="brand">
      <span class="logo" id="logo-side" title="На главную">dk</span>
      <div>
        <h1>Дашборд devkit</h1>
        <p id="brand-note"></p>
      </div>
    </div>
    <div class="sgroup">Проекты</div>
    <nav id="projects"></nav>
    <div class="sgroup">Разделы</div>
    <div class="sitem" id="nav-home">Главная</div>
    <div class="sitem" id="nav-board">Доска</div>
    <div class="sitem" id="nav-agents">Агенты<span class="n" id="nav-agents-n"></span></div>
    <div class="squota" id="quota"></div>
    <div class="sfoot"><button id="logout" class="btn">Выйти</button></div>
  </aside>
  <main class="bmain">
    <div class="bhead">
      <span class="logo logo-top" id="logo-top" title="На главную">dk</span>
      <h2 id="pname"></h2>
      <span class="sub" id="psub"></span>
      <span id="hlegend"></span>
      <span class="hsp"></span>
      <button class="bell" id="bell" aria-label="Лента уведомлений" title="Лента уведомлений"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.6c0-3.3-2.7-6-6-6s-6 2.7-6 6c0 4.1-1.1 5.8-1.9 6.7-.4.4-.1 1.1.5 1.1h14.8c.6 0 .9-.7.5-1.1-.8-.9-1.9-2.6-1.9-6.7Z"></path><path d="M10 19.2c.4.8 1.1 1.3 2 1.3s1.6-.5 2-1.3"></path></svg><i id="bell-dot" class="bdot" hidden></i></button>
      <select class="pselect" id="pselect" aria-label="Проект"></select>
    </div>
    <div class="live" id="live"></div>
    <div class="actmsg" id="actmsg"></div>
    <div class="groups" id="groups"></div>
  </main>
  <nav class="ptabs">
    <div class="ptab" id="tab-home"><s></s>Главная</div>
    <div class="ptab" id="tab-board"><s></s>Доска</div>
    <div class="ptab" id="tab-agents"><s></s>Агенты</div>
  </nav>
  <div class="flashes" id="flashes"></div>
</div>
<!-- значки экранов лежат разметкой, а js их только копирует: рисовать фигуры
     рамками в стилях выходило обрубками, а внешних картинок у статики нет -->
<template id="icons">
  <svg data-ico="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg>
  <svg data-ico="i-wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5v5l3 1.8"></path></svg>
  <svg data-ico="i-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-8.5"></path></svg>
  <svg data-ico="i-other" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle></svg>
  <svg data-ico="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6.5l9 5.5-9 5.5Z"></path></svg>
  <svg data-ico="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5c0 3.6-3.6 6.5-8 6.5-.9 0-1.8-.1-2.6-.4L5 20.5l1.2-3.2C4.8 16.1 4 14.4 4 12.5 4 8.9 7.6 6 12 6s8 2.9 8 6.5Z"></path></svg>
  <svg data-ico="i-live" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h4l2.5-6 4.5 12 2.5-6h4.5"></path></svg>
  <svg data-ico="close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8"></path><path d="M12 4l-8 8"></path></svg>
</template>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
