<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд devkit</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="screen">
  <aside class="side">
    <div class="brand">
      <h1>Дашборд devkit</h1>
      <p id="brand-note"></p>
    </div>
    <div class="sgroup">Проекты</div>
    <nav id="projects"></nav>
    <div class="sgroup">Разделы</div>
    <div class="sitem" id="nav-home">Главная</div>
    <div class="sitem" id="nav-board">Доска</div>
    <div class="sitem off">Агенты</div>
    <div class="squota" id="quota"></div>
    <div class="sfoot"><button id="logout" class="btn">Выйти</button></div>
  </aside>
  <main class="bmain">
    <div class="bhead">
      <h2 id="pname"></h2>
      <span class="sub" id="psub"></span>
      <button class="btn btn-sm gohome" id="gohome">На главную</button>
      <button class="bell" id="bell" aria-label="Лента уведомлений" title="Лента уведомлений"><s></s><i id="bell-dot" class="bdot" hidden></i></button>
      <select class="pselect" id="pselect" aria-label="Проект"></select>
    </div>
    <div class="live" id="live"></div>
    <div class="actmsg" id="actmsg"></div>
    <div class="groups" id="groups"></div>
  </main>
  <nav class="ptabs">
    <div class="ptab" id="tab-home"><s></s>Главная</div>
    <div class="ptab" id="tab-board"><s></s>Доска</div>
    <div class="ptab"><s></s>Агенты</div>
  </nav>
</div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
