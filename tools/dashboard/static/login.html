<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход - дашборд devkit</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="screen">
  <form class="login" id="login-form">
    <h1>Дашборд devkit</h1>
    <p>Токен входа печатает команда dashboard secret на машине.</p>
    <input id="token" type="password" autocomplete="current-password" placeholder="токен" autofocus>
    <button class="btn btn-acc btn-lg" type="submit">Войти</button>
    <div class="error" id="login-error"></div>
  </form>
</div>
<script type="module" src="/assets/login.js"></script>
</body>
</html>
